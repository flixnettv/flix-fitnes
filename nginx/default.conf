server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # Backend API routes -> Django
    location ~ ^/(api|admin|health|ready|static|media)/ {
        proxy_pass http://fitpro-hftv-backend-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # QR pairing landing page
    location /pair/ {
        alias /usr/share/pair/;
        try_files $uri $uri/ /pair/index.html;
    }

    # Flutter PWA (mobile app build)
    location /pwa/ {
        alias /usr/share/pwa/;
        try_files $uri $uri/ /pwa/index.html;
    }

    # React Dashboard SPA (primary web UI)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
