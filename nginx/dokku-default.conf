upstream django {
    server 127.0.0.1:8000;
}

server {
    listen 8080;
    server_name _;

    root /opt/web/dashboard;
    index index.html;

    client_max_body_size 100M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    # Django-owned paths
    location ~ ^/(api|admin|health|ready|__debug__)/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Collected static (admin/css/js) served from shared volume
    location /static/ {
        alias /data/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Uploaded media served from shared volume
    location /media/ {
        alias /data/media/;
        expires 7d;
    }

    # QR device pairing landing page
    location /pair/ {
        alias /opt/web/pair/;
        try_files $uri $uri/ /pair/index.html;
    }

    # Flutter PWA (mobile app build)
    location /pwa/ {
        alias /opt/web/pwa/;
        try_files $uri $uri/ /pwa/index.html;
    }

    # React Dashboard SPA (primary web UI)
    location / {
        try_files $uri $uri/ /index.html;
    }
}