name: Build FitPro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: cd flutter-app && flutter pub get
      - run: cd flutter-app && flutter build web --release

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: cd flutter-app && flutter pub get
      - run: cd flutter-app && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fitpro-apk
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk
