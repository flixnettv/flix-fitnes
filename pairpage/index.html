<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ربط الجهاز — FitPro Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  :root { --brand:#C6F24E; --bg:#0B110D; --panel:#121a13; --line:#22301f; --moss:#8fa08a; --snow:#f2f7ef; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Tajawal",sans-serif;background:var(--bg);color:var(--snow);min-height:100vh;display:grid;place-items:center;padding:24px;
       background-image:radial-gradient(1200px 500px at 80% -10%,rgba(198,242,78,.07),transparent),radial-gradient(900px 400px at 10% 110%,rgba(69,214,192,.05),transparent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:36px 30px;width:100%;max-width:420px;text-align:center}
  .logo{width:56px;height:56px;border-radius:16px;background:var(--brand);color:#0b110d;display:grid;place-items:center;font-family:Cairo;font-weight:800;font-size:24px;margin:0 auto 14px}
  h1{font-family:Cairo;font-size:19px;margin-bottom:6px}
  .sub{color:var(--moss);font-size:12.5px;line-height:1.7;margin-bottom:22px}
  .code{font-family:Cairo;font-weight:800;font-size:34px;letter-spacing:6px;color:var(--brand);direction:ltr;margin:10px 0 4px}
  button{width:100%;border:none;border-radius:14px;padding:15px;font-family:Cairo;font-weight:700;font-size:14px;cursor:pointer;transition:.2s}
  .primary{background:var(--brand);color:#0b110d}
  .primary:hover{filter:brightness(1.08)}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--moss);margin-top:10px}
  input{width:100%;background:#0d130e;border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--snow);font-size:15px;text-align:center;outline:none;margin-top:14px;font-family:Cairo}
  input:focus{border-color:var(--brand)}
  .ok{color:#7ee08a}.err{color:#ff8a8a;font-size:13px;margin-top:12px;line-height:1.7}
  .hidden{display:none}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid #0b110d;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-inline-end:6px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">F</div>
  <h1>ربط جهاز بحسابك في FitPro</h1>
  <div class="sub">امسحت رمز الاستجابة من شاشة الإقران — أكّد الربط ليُنشأ اتصال آمن بين جهازك وحسابك.</div>

  <div id="stepCode">
    <div class="sub">رمز الإقران:</div>
    <div class="code" id="codeView">------</div>
    <button class="primary" id="btnConfirm"><span class="spin hidden" id="sp"></span>تأكيد الربط بالحساب</button>
    <div class="err" id="msg"></div>
  </div>

  <div id="stepDone" class="hidden">
    <div class="code ok">✓</div>
    <div class="sub" id="doneMsg">تم ربط الجهاز بنجاح!</div>
    <input type="number" step="0.1" id="wInput" placeholder="وزنك الحالي الآن (كغ) — اختياري" dir="ltr"/>
    <button class="primary" style="margin-top:12px" id="btnPush">إرسال القراءة للمنصة</button>
    <button class="ghost" onclick="location.reload()">ربط جهاز آخر</button>
    <div class="err" id="msg2"></div>
  </div>
</div>

<script>
const qs = new URLSearchParams(location.search);
const code = (qs.get("c") || "").replace(/\D/g,"").slice(0,6);
document.getElementById("codeView").textContent = code.padEnd(6,"·");
let INGEST = "";

document.getElementById("btnConfirm").onclick = async () => {
  const sp = document.getElementById("sp"); sp.classList.remove("hidden");
  try {
    const r = await fetch(`/api/v1/devices/confirm/${code}/`, { method:"POST" });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "فشل الربط");
    INGEST = j.ingest_token;
    document.getElementById("doneMsg").textContent = `تم ربط «${j.device}» بنجاح!`;
    document.getElementById("stepCode").classList.add("hidden");
    document.getElementById("stepDone").classList.remove("hidden");
  } catch(e) {
    document.getElementById("msg").textContent = e.message || "رمز غير صالح أو منتهي";
  } finally { sp.classList.add("hidden"); }
};

document.getElementById("btnPush").onclick = async () => {
  const w = parseFloat(document.getElementById("wInput").value);
  if (!w || w <= 0) { document.getElementById("msg2").textContent = "أدخل وزناً صحيحاً"; return; }
  try {
    const r = await fetch(`/api/v1/devices/ingest/${INGEST}/`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ readings:[{ metric:"weight_kg", value:w }] }),
    });
    if (!r.ok) throw new Error();
    document.getElementById("msg2").className = "err ok";
    document.getElementById("msg2").textContent = `✓ وصل الوزن (${w} كغ) — افتح تطبيق FitPro لتراه`;
  } catch { document.getElementById("msg2").textContent = "تعذّر الإرسال"; }
};
</script>
</body>
</html>
